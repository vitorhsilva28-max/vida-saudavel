<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vida Saudável - Metas</title>
  <link rel="stylesheet" href="/css/metas.css">

  <script src="/imagens/imgblack.png"></script>
</head>
<body>

 
  <header class="header">
    <div class="logo">
      <span class="logo-icon">🏋️</span>
      <div class="logo-text">
        <span>VIDA</span>
        <span>SAUDAVEL</span>
      </div>
    </div>
    
    <nav class="nav-menu">
      <a href="home.html">Home</a>
      <a href="/html/exerc.html">Exercícios</a>
      <a href="metas.html" class="active">Metas</a>
    </nav>
  </header>


  <main class="dashboard-container">
    
 
    <section class="goals-list">

     
      <div class="goal-item">
        <div class="goal-info">
          <div class="icon-box">
            <i data-lucide="droplet"></i>
          </div>
          <div class="goal-text">
            <h3>Beber 2L de água</h3>
            <p>6 a 8 copos consumidos</p>
          </div>
        </div>
        <div class="goal-progress">
          <div class="progress-bar">
            <div class="progress-fill" style="width: 60%;"></div>
          </div>
          <span class="check-circle"></span>
        </div>
      </div>


      <div class="goal-item">
        <div class="goal-info">
          <div class="icon-box">
            <i data-lucide="moon"></i>
          </div>
          <div class="goal-text">
            <h3>Dormir antes das 23h</h3>
            <p>Você precisa de 7-8 horas de sono</p>
          </div>
        </div>
        <div class="goal-progress">
          <div class="progress-bar">
            <div class="progress-fill" style="width: 80%;"></div>
          </div>
          <span class="check-circle checked">✓</span>
        </div>
      </div>


      <div class="goal-item">
        <div class="goal-info">
          <div class="icon-box">
            <i data-lucide="apple"></i>
          </div>
          <div class="goal-text">
            <h3>Comer fruta</h3>
          </div>
        </div>
        <div class="goal-progress">
          <div class="progress-bar">
            <div class="progress-fill" style="width: 65%;"></div>
          </div>
          <span class="check-circle"></span>
        </div>
      </div>

   
      <div class="goal-item">
        <div class="goal-info">
          <div class="icon-box">
            <i data-lucide="activity"></i>
          </div>
          <div class="goal-text">
            <h3>15 min de exercicio</h3>
          </div>
        </div>
        <div class="goal-progress">
          <div class="progress-bar">
            <div class="progress-fill" style="width: 40%;"></div>
          </div>
          <span class="check-circle"></span>
        </div>
      </div>

    </section>

    <section class="trophy-section">
      <i data-lucide="trophy" class="trophy-icon"></i>
    </section>

  </main>

</body>
</html>
